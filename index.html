<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You — Jhody</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:wght@400;500&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(circle at 50% 40%, rgba(180,150,90,.09), transparent 35%),
        #070707;
    color: #eee;
    font-family: 'Inter', sans-serif;
    overflow: hidden;
}

/* grain */

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: .045;
    z-index: 20;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E");
}

.page {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 30px;
    position: relative;
}

.top-label {
    position: absolute;
    top: 30px;
    left: 35px;
    font-size: 10px;
    letter-spacing: 4px;
    color: #9f8a61;
    text-transform: uppercase;
}

.number {
    position: absolute;
    top: 30px;
    right: 35px;
    font-size: 10px;
    color: #555;
    letter-spacing: 2px;
}

.photo-wrapper {
    position: relative;
    width: min(310px, 72vw);
    height: min(420px, 57vh);
    margin-bottom: 35px;
    animation: appear 1.4s ease forwards;
}

.photo-wrapper::before {
    content: "";
    position: absolute;
    inset: -10px;
    border: 1px solid rgba(180,150,90,.18);
    transform: rotate(2deg);
}

.photo-wrapper::after {
    content: "";
    position: absolute;
    inset: -5px;
    border: 1px solid rgba(180,150,90,.08);
    transform: rotate(-1deg);
}

.photo {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    filter: grayscale(15%) contrast(1.04) brightness(.82);
    position: relative;
    z-index: 2;
}

.overlay {
    position: absolute;
    inset: 0;
    z-index: 3;
    background: linear-gradient(
        to bottom,
        transparent 50%,
        rgba(0,0,0,.65)
    );
    pointer-events: none;
}

.text {
    text-align: center;
    animation: textAppear 1.6s ease forwards;
}

.small {
    font-size: 9px;
    letter-spacing: 4px;
    color: #9f8a61;
    margin-bottom: 12px;
    text-transform: uppercase;
}

h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(32px, 7vw, 58px);
    font-weight: 400;
    letter-spacing: -1px;
    margin-bottom: 12px;
}

.subtitle {
    font-size: 12px;
    color: #777;
    letter-spacing: 1px;
    margin-bottom: 28px;
}

.open-btn {
    display: inline-flex;
    align-items: center;
    gap: 18px;
    padding: 13px 23px;
    border: 1px solid #665637;
    background: transparent;
    color: #b8a174;
    text-decoration: none;
    font-size: 10px;
    letter-spacing: 3px;
    transition: .4s ease;
}

.open-btn:hover {
    background: #b8a174;
    color: #080808;
    border-color: #b8a174;
}

.line {
    position: absolute;
    bottom: 30px;
    width: 60px;
    height: 1px;
    background: #493f2c;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: scale(.94) translateY(20px);
    }

    to {
        opacity: 1;
        transform: scale(1) translateY(0);
    }
}

@keyframes textAppear {
    from {
        opacity: 0;
        transform: translateY(20px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@media(max-width:600px) {

    .photo-wrapper {
        width: 245px;
        height: 350px;
    }

    .top-label {
        left: 20px;
    }

    .number {
        right: 20px;
    }
}
</style>
</head>

<body>

<main class="page">

    <div class="top-label">
        A SMALL THING
    </div>

    <div class="number">
        01 / 02
    </div>

    <div class="photo-wrapper">
        <img src="images/her.jpg" class="photo" alt="Photo">
        <div class="overlay"></div>
    </div>

    <div class="text">

        <div class="small">
            from jhody
        </div>

        <h1>For You.</h1>

        <div class="subtitle">
            nothing dramatic. just open it.
        </div>

        <a href="second.html" class="open-btn">
            OPEN
            <span>→</span>
        </a>

    </div>

    <div class="line"></div>

</main>

</body>
</html>
